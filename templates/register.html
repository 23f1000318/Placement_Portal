<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Placement Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="main">
        <div id="canvas" style="max-width: 500px;">
            <div id="form-body">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #0d9488;"></i>
                    <h1 class="mt-2">Create Account</h1>
                    <p class="text-muted">Choose your account type</p>
                </div>
                <form action="/register" method="post">
                <div class="mb-4">
                    <label for="userType" class="form-label"><i class="bi bi-people"></i> Register as</label>
                    <select class="form-select" name="user_type" id="userType" required>
                        <option value="">Select Account Type</option>
                        <option value="student">🎓 Student</option>
                        <option value="company">🏢 Company</option>
                    </select>
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-arrow-right"></i> Continue
                    </button>
                </div>
                <div class="text-center">
                    <p class="text-muted mb-0">Already have an account? <a href="/login" class="fw-bold">Sign In</a></p>
                    <p class="text-muted mt-3"><a href="/" class="text-decoration-none">Back to Home</a></p>
                </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
