<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Company Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: auto; padding: 20px;">
                <h1>Edit Company Profile</h1>
                <form action="/company/edit_profile/{{user_id}}" method="post">
                <div class="mb-3">
                    <label for="company_name" class="form-label">Company Name</label>
                    <input type="text" class="form-control" name="company_name" value="{{company.company_name}}" required>
                </div>
                <div class="mb-3">
                    <label for="industry" class="form-label">Industry</label>
                    <input type="text" class="form-control" name="industry" value="{{company.industry}}" required>
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" value="{{company.location}}" required>
                </div>
                <div class="mb-3">
                    <label for="hr_contact" class="form-label">HR Contact</label>
                    <input type="text" class="form-control" name="hr_contact" value="{{company.hr_contact}}" required>
                </div>
                <div class="mb-3">
                    <label for="website" class="form-label">Website</label>
                    <input type="text" class="form-control" name="website" value="{{company.website}}">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3">{{company.description}}</textarea>
                </div>
                <div style="text-align: center;">
                <input type="submit" class="btn btn-success" value="Update Profile"> 
                <a href="/company/{{user_id}}" class="btn btn-secondary">Cancel</a>
               </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
