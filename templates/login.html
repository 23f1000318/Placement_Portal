<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Placement Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="main">
        <div id="canvas" style="max-width: 500px;">
            <div id="form-body">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill" style="font-size: 3rem; color: #0d9488;"></i>
                    <h1 class="mt-2">Placement Portal</h1>
                    <p class="text-muted">Sign in to your account</p>
                </div>
                <form action="/login" method="post">
                <div class="mb-4">
                    <label for="Input1" class="form-label"><i class="bi bi-person"></i> Username</label>
                    <input type="text" class="form-control" id="Input1" name="username" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label for="Input2" class="form-label"><i class="bi bi-lock"></i> Password</label>
                    <input type="password" class="form-control" id="Input2" name="pwd" placeholder="Enter password" required>
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </div>
                <div class="text-center">
                    <p class="text-muted mb-0">Don't have an account? <a href="/register" class="fw-bold">Register here</a></p>
                    <p class="text-muted mt-3"><a href="/" class="text-decoration-none">Back to Home</a></p>
                </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
