<!DOCTYPE html>
<html lang="en">
<head>
    <title>Update Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: auto; padding: 20px;">
                <h1>Update Profile</h1>
                <form action="/student/update_profile/{{user_id}}" method="post">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="full_name" value="{{student.full_name}}" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone" value="{{student.phone}}" required>
                </div>
                <div class="mb-3">
                    <label for="cgpa" class="form-label">CGPA</label>
                    <input type="number" step="0.01" class="form-control" name="cgpa" value="{{student.cgpa}}" required>
                </div>
                <div class="mb-3">
                    <label for="skills" class="form-label">Skills (comma separated)</label>
                    <input type="text" class="form-control" name="skills" value="{{student.skills or ''}}" placeholder="Python, Java, SQL, Communication">
                </div>
                <div class="mb-3">
                    <label for="resume_link" class="form-label">Resume Link (Google Drive, Dropbox, etc.)</label>
                    <input type="url" class="form-control" name="resume_link" value="{{student.resume_link or ''}}" placeholder="https://drive.google.com/...">
                    <small class="text-muted">Upload your resume to Google Drive or Dropbox and paste the shareable link here</small>
                </div>
                <div style="text-align: center;">
                <input type="submit" class="btn btn-success" value="Update Profile"> 
                <a href="/student/{{user_id}}" class="btn btn-secondary">Cancel</a>
               </div>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
